<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creaciones Alma | Papelería creativa</title>
    <meta name="description" content="Papelería creativa hecha a mano: fotos Polaroid, stickers, álbumes e impresiones personalizadas. Envíos a todo el país y retiro en Marcos Paz.">
    <meta name="theme-color" content="#ec4899">

    <!-- Vista previa al compartir el link (WhatsApp, Instagram, Facebook) -->
    <meta property="og:type" content="website">
    <meta property="og:locale" content="es_AR">
    <meta property="og:site_name" content="Creaciones Alma">
    <meta property="og:title" content="Creaciones Alma | Papelería creativa">
    <meta property="og:description" content="Papelería creativa hecha a mano: fotos Polaroid, stickers, álbumes e impresiones personalizadas.">
    <!-- __SITE_URL__ lo reemplaza el build con VITE_SITE_URL (las redes piden la URL completa de la imagen) -->
    <meta property="og:image" content="__SITE_URL__/og-imagen.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Creaciones Alma, papelería creativa hecha a mano">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="__SITE_URL__/og-imagen.png">

    <!-- Datos estructurados para Google -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "Creaciones Alma",
        "description": "Papelería creativa hecha a mano: fotos Polaroid, stickers, álbumes e impresiones personalizadas.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Marcos Paz",
          "addressRegion": "Buenos Aires",
          "addressCountry": "AR"
        },
        "areaServed": "AR",
        "currenciesAccepted": "ARS",
        "paymentAccepted": "Mercado Pago, transferencia bancaria, efectivo"
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Poppins:wght@400;500;600;700;800&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
